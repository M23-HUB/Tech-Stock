name: Daily stock data
on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC Mon–Fri, after US close
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit CSVs back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch daily bars
        run: python main.py daily
        env:
          TWELVEDATA_API: ${{ secrets.TWELVEDATA_API }}
          POWER_BI_TENANT_ID:    ${{ secrets.POWER_BI_TENANT_ID }}
          POWER_BI_CLIENT_ID:    ${{ secrets.POWER_BI_CLIENT_ID }}
          POWER_BI_CLIENT_SECRET: ${{ secrets.POWER_BI_CLIENT_SECRET }}
          POWER_BI_WORKSPACE_ID: ${{ secrets.POWER_BI_WORKSPACE_ID }}
          POWER_BI_DATASET_ID:   ${{ secrets.POWER_BI_DATASET_ID }}

      - name: Commit updated data
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Daily_stock_data.json stock_data_combined_daily.csv
          git diff --quiet --cached || git commit -m "chore: daily stock data update [skip ci]"
          git push
