name: Weekly company news
on:
  schedule:
    - cron: "0 6 * * 1"     # 06:00 UTC every Monday
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python your_script.py news
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Commit updated news
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add company_info.json news_last_updated.json
          git diff --quiet --cached || git commit -m "chore: weekly company news refresh [skip ci]"
          git push
