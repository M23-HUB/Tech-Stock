name: Daily Stock Data Update

on:  
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Get File
      run: python main.py daily
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyfabricops  # For Power BI integration
        
    - name: Run stock data fetcher
      env:
        ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        POWER_BI_TENANT_ID: ${{ secrets.POWER_BI_TENANT_ID }}
        POWER_BI_CLIENT_ID: ${{ secrets.POWER_BI_CLIENT_ID }}
        POWER_BI_CLIENT_SECRET: ${{ secrets.POWER_BI_CLIENT_SECRET }}
        POWER_BI_WORKSPACE_ID: ${{ secrets.POWER_BI_WORKSPACE_ID }}
        POWER_BI_DATASET_ID: ${{ secrets.POWER_BI_DATASET_ID }}
      run: |
        python your_script_name.py
        
    - name: Commit and push updated data
      run: |
        git config user.name  "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git add stock_data_combined_daily.csv Daily_stock_data.json
        git diff --quiet --cached || git commit -m "chore: daily stock data update"
        git push
      # This will push any updated CSV/JSON files back to the repo
        
    - name: Upload data as artifact (optional)
      uses: actions/upload-artifact@v3
      with:
        name: stock-data
        path: |
          *.csv
          *.json
        retention-days: 30
