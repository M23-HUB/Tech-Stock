name: Daily Stock Data Update

on:  
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Get File
      run: python live_data.py daily
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyfabricops  # For Power BI integration
        
    - name: Run stock data fetcher
      env:
        ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        POWER_BI_TENANT_ID: ${{ secrets.POWER_BI_TENANT_ID }}
        POWER_BI_CLIENT_ID: ${{ secrets.POWER_BI_CLIENT_ID }}
        POWER_BI_CLIENT_SECRET: ${{ secrets.POWER_BI_CLIENT_SECRET }}
        POWER_BI_WORKSPACE_ID: ${{ secrets.POWER_BI_WORKSPACE_ID }}
        POWER_BI_DATASET_ID: ${{ secrets.POWER_BI_DATASET_ID }}
      run: |
        python your_script_name.py
        
    - name: Commit and push updated data
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add *.csv *.json
        git diff --staged --quiet || git commit -m "Update stock data [skip ci]"
        git push
      # This will push any updated CSV/JSON files back to the repo
        
    - name: Upload data as artifact (optional)
      uses: actions/upload-artifact@v3
      with:
        name: stock-data
        path: |
          *.csv
          *.json
        retention-days: 30
