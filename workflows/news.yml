name: Daily Stock Data Update

on:  
  schedule:
    - cron: "0 6 * * 1" 
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Get File
      run: python main.py daily
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyfabricops  # For Power BI integration
        
    - name: Fetch news
      run: python main.py news
      env:
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
              
    - name: Commit updated company_info.json
      run: |
        git config user.name  "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git add company_info.json
        git diff --quiet --cached || git commit -m "chore: weekly company news refresh"
        git push
      # This will push any updated CSV/JSON files back to the repo
